<p><strong>最高人民法院关于审理第一审专利案件聘请专家担任陪审员的复函</strong></p>
<blockquote>
<p>1991年6月6日　法（经）函〔1991〕64号</p>
</blockquote>
<p>北京市高级人民法院：</p>
<p>你院京高法〔1990〕第208号请示收悉。经研究，同意你院的意见。人民法院在审理第一审专利案件时，可以根据该案件所涉及的技术领域，聘请有关技术专家担任陪审员。</p>
