<p>各类监控化学品名录</p>
<p>各类监控化学品名录 （《各类监控化学品名录》已经2020年4月23日工业和信息化部第15次部务会议审议通过，并报国务院批准，现予公布，自公布之日起施行。原化学工业部1996年5月15日公布的《各类监控化学品名录》（化学工业部令第11号）同时废止。） 附件：各类监控化学品名录</p>
