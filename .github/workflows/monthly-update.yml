name: monthly-update
on:
  schedule:
    - cron: '0 20 1 * *'   # 每月 1 日 UTC 20:00（北京时间 2 日凌晨 4:00）
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取 AI Lawsuit Tracker 并更新数据
        run: python scripts/monthly_update.py
      - name: 提交并推送
        run: |
          git config user.name "lawstudy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "monthly-update $(date -u +%Y-%m-%d): 自动收录新增版权案件"
            git push
          fi
